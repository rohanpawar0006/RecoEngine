[project]
name = "reco-engine"
version = "0.1.0"
description = "Two-Stage Recommendation Engine (MovieLens 25M)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W293"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
